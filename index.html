<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHRED.</title>
<style>
.infoleiste {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10000px;

    padding: 40px;

    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
		position: absolute;
		transform: translate(-50%, -50%);
		top: 5vw;
		left: 50%;
		width:80vw;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;
    background-image: url("hintergrund.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* ============================================================
   ADMIN-OBERFLÄCHE (Passwort-Fenster + Panel)
   ============================================================ */

.admin-ui {
    font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
    color: #f2f2f5;
    z-index: 999999;
}

/* --- Passwort-Fenster --- */
.admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000000;
}

.admin-dialog {
    width: min(420px, 100%);
    background: rgba(24, 24, 28, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 22px;
    padding: 26px 26px 22px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    animation: adminPop 0.18s ease-out;
}

@keyframes adminPop {
    from { transform: translateY(10px) scale(0.98); opacity: 0; }
    to   { transform: none; opacity: 1; }
}

.admin-dialog h2 {
    margin: 0 0 6px;
    font-size: 20px;
    letter-spacing: 0.04em;
}

.admin-dialog p {
    margin: 0 0 16px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.62);
}

.admin-input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 15px;
    font: inherit;
    font-size: 15px;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
}

.admin-input:focus {
    border-color: rgba(255, 255, 255, 0.55);
    background: rgba(255, 255, 255, 0.12);
}

.admin-error {
    min-height: 18px;
    margin-top: 8px;
    font-size: 13px;
    color: #ff8d8d;
}

.admin-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.admin-btn {
    flex: 1;
    padding: 12px 16px;
    font: inherit;
    font-size: 14px;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
}

.admin-btn:hover { background: rgba(255, 255, 255, 0.18); }
.admin-btn:active { transform: scale(0.985); }

.admin-btn.primary {
    background: #fff;
    color: #111;
    border-color: #fff;
    font-weight: 600;
}

.admin-btn.primary:hover { background: #e9e9e9; }

/* --- Bearbeitungs-Panel --- */
.admin-panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100dvh;
    width: min(420px, 100vw);
    display: flex;
    flex-direction: column;
    background: rgba(18, 18, 22, 0.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-left: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: -20px 0 60px rgba(0, 0, 0, 0.45);
    animation: adminSlide 0.22s ease-out;
}

@keyframes adminSlide {
    from { transform: translateX(30px); opacity: 0; }
    to   { transform: none; opacity: 1; }
}

.admin-panel-head {
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.admin-panel-head .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.admin-panel-head h2 {
    margin: 0;
    font-size: 17px;
    letter-spacing: 0.06em;
}

.admin-close {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 50%;
    cursor: pointer;
}

.admin-close:hover { background: rgba(255, 255, 255, 0.2); }

.admin-toolbar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.admin-toolbar .admin-input { padding: 9px 12px; font-size: 13px; }

.admin-note {
    margin: 10px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.5);
}

.admin-list {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.admin-item label {
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
}

.admin-item label .tag {
    color: #9fd3ff;
    text-transform: none;
}

.admin-item label .cls {
    color: #ffd39f;
    text-transform: none;
}

.admin-item textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 44px;
    resize: vertical;
    padding: 11px 13px;
    font: inherit;
    font-size: 14px;
    line-height: 1.45;
    color: #fff;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    outline: none;
}

.admin-item textarea:focus {
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.11);
}

.admin-item .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 5px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.42);
}

.admin-link {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 11px;
    color: #9fd3ff;
    cursor: pointer;
    text-decoration: underline;
}

.admin-panel-foot {
    display: flex;
    gap: 8px;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(12, 12, 15, 0.7);
}

.admin-panel-foot .admin-btn { font-size: 13px; padding: 11px 12px; }

.admin-status {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
    padding: 0 20px 10px;
    min-height: 14px;
}

.admin-status.ok { color: #8fe1a3; }
.admin-status.err { color: #ff8d8d; }

/* Markierung der bearbeitbaren Elemente, wenn Admin-Modus an ist */
body.admin-mode [data-editable="1"] {
    outline: 1px dashed rgba(159, 211, 255, 0.55);
    outline-offset: 3px;
    border-radius: 4px;
    cursor: text;
}

body.admin-mode [data-editable="1"]:hover {
    outline-color: rgba(159, 211, 255, 1);
    background: rgba(159, 211, 255, 0.08);
}

.admin-toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    padding: 11px 20px;
    font-size: 13px;
    color: #111;
    background: #fff;
    border-radius: 10000px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    z-index: 1000001;
    animation: adminPop 0.18s ease-out;
}
</style>

</div>

		<button class="adminpanel" id="adminpanel" data-no-edit style="   background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10000px;

    padding: 35px;

    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
		position: absolute;

<!-- ============================================================
     ADMIN
     ============================================================ -->
<script>
(function () {
    "use strict";

    /* ==========================================================
       1) EINSTELLUNGEN – hier anpassen
       ========================================================== */

    var ADMIN_CONFIG = {
        /*
         * Welche Elemente dürfen bearbeitet werden?
         *
         * LEER  = ALLE Textelemente der Seite sind bearbeitbar.
         *
         * Oder gezielt Klassen angeben, z. B.:
         *   editableClasses: ["editierbar", "preis", "titel"]
         *
         * Dann sind alle Elemente mit einer dieser Klassen (und deren
         * Inhalt) bearbeitbar. Einzelne Elemente ausnehmen:
         *   <h1 data-no-edit>...</h1>
         */
        editableClasses: [],

        /** Texte automatisch alle X ms neu laden (0 = aus) */
        pollInterval: 30000,

        /** API-Pfade (normalerweise nicht ändern) */
        api: {
            content: "/api/content",
            login: "/api/login",
            session: "/api/session",
            logout: "/api/logout"
        },

        /** localStorage-Schlüssel für den Login-Token */
        tokenKey: "shred-admin-token"
    };

    /* ==========================================================
       2) HILFSFUNKTIONEN
       ========================================================== */

    var TOKEN = null;
    try { TOKEN = sessionStorage.getItem(ADMIN_CONFIG.tokenKey); } catch (e) {}

    var state = {
        remote: {},        // gespeicherte Texte vom Server
        originals: {},     // Texte wie sie in der HTML-Datei stehen
        entries: [],       // bearbeitbare Elemente
        lastUpdatedAt: null,
        pollTimer: null,
        saving: false
    };

    function $(sel, root) { return (root || document).querySelector(sel); }

    function el(tag, className, text) {
        var n = document.createElement(tag);
        if (className) n.className = className;
        if (text != null) n.textContent = text;
        return n;
    }

    function toast(message) {
        var t = el("div", "admin-ui admin-toast", message);
        document.body.appendChild(t);
        setTimeout(function () {
            t.style.transition = "opacity .25s";
            t.style.opacity = "0";
            setTimeout(function () { t.remove(); }, 260);
        }, 2000);
    }

    /** Direkte Textknoten eines Elements (ohne Kind-Elemente) */
    function directText(el) {
        var out = "";
        for (var i = 0; i < el.childNodes.length; i++) {
            var n = el.childNodes[i];
            if (n.nodeType === 3) out += n.nodeValue;
        }
        return out;
    }

    /** Ersetzt die direkten Textknoten, Kind-Elemente (Bilder etc.) bleiben! */
    function setDirectText(node, text) {
        var first = null;
        for (var i = 0; i < node.childNodes.length; i++) {
            var n = node.childNodes[i];
            if (n.nodeType === 3) {
                if (!first) { first = n; n.nodeValue = text; }
                else { n.nodeValue = ""; }
            }
        }
        if (!first) node.appendChild(document.createTextNode(text));
    }

    /**
     * Stabiler Schlüssel für ein Element, z. B. "div[1]/h1[1]".
     * Hängt NICHT an Klassen oder IDs – die kann man also ändern.
     */
    function pathKey(node) {
        var parts = [];
        var current = node;
        while (current && current.nodeType === 1 && current !== document.body) {
            var index = 1;
            var sib = current;
            while ((sib = sib.previousElementSibling)) {
                if (sib.tagName === current.tagName) index++;
            }
            var id = current.tagName.toLowerCase() + "[" + index + "]";
            // eigene data-edit-id hat Vorrang und bleibt dauerhaft stabil
            if (current.getAttribute && current.getAttribute("data-edit-id")) {
                id = current.tagName.toLowerCase() + "#" + current.getAttribute("data-edit-id");
            }
            parts.unshift(id);
            current = current.parentElement;
        }
        return parts.join("/");
    }

    function resolveKey(key) {
        if (!key) return null;
        var parts = key.split("/");
        var current = document.body;
        for (var i = 0; i < parts.length; i++) {
            var part = parts[i];
            var m = part.match(/^([a-z0-9-]+)(?:\[(\d+)\]|#(.+))?$/i);
            if (!m) return null;
            var tag = m[1].toUpperCase();

            if (m[3]) {
                // per data-edit-id suchen
                var found = null;
                for (var k = 0; k < current.children.length; k++) {
                    if (
                        current.children[k].tagName === tag &&
                        current.children[k].getAttribute("data-edit-id") === m[3]
                    ) { found = current.children[k]; break; }
                }
                if (!found) return null;
                current = found;
            } else {
                var wanted = m[2] ? parseInt(m[2], 10) : 1;
                var count = 0;
                var next = null;
                for (var j = 0; j < current.children.length; j++) {
                    var child = current.children[j];
                    if (child.tagName !== tag) continue;
                    if (child.hasAttribute("data-edit-id")) continue;
                    count++;
                    if (count === wanted) { next = child; break; }
                }
                if (!next) return null;
                current = next;
            }
        }
        return current;
    }

    /* ==========================================================
       3) BEARBEITBARE ELEMENTE FINDEN
       ========================================================== */

    var SKIP_TAGS = {
        SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEMPLATE: 1, LINK: 1, META: 1,
        TITLE: 1, HEAD: 1, HTML: 1, BODY: 1, IFRAME: 1, CANVAS: 1,
        VIDEO: 1, AUDIO: 1, SVG: 1, IMG: 1, INPUT: 1, TEXTAREA: 1,
        SELECT: 1, OPTION: 1, BR: 1, HR: 1
    };

    function classSelector() {
        var list = ADMIN_CONFIG.editableClasses || [];
        if (!list.length) return null;
        return list.map(function (c) {
            return c.charAt(0) === "." ? c : "." + c;
        }).join(",");
    }

    function isEditable(node) {
        if (!node || node.nodeType !== 1) return false;
        if (SKIP_TAGS[node.tagName]) return false;
        if (node.closest("[data-no-edit], .admin-ui")) return false;
        if (node.getAttribute("contenteditable") === "true") return false;
        if (directText(node).trim() === "") return false;

        var sel = classSelector();
        if (sel) {
            if (!node.matches(sel) && !node.closest(sel)) return false;
        }
        return true;
    }

    function collectEntries() {
        var nodes = document.body.querySelectorAll("*");
        var list = [];
        var seen = {};

        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            if (!isEditable(node)) continue;

            var key = pathKey(node);
            if (!key || seen[key]) continue;
            seen[key] = true;

            var text = directText(node).replace(/\s+/g, " ").trim();
            state.originals[key] = text;
            node.setAttribute("data-editable", "1");

            list.push({
                key: key,
                node: node,
                tag: node.tagName.toLowerCase(),
                classes: (node.className || "").toString().trim(),
                original: text
            });
        }

        state.entries = list;
        return list;
    }

    /* ==========================================================
       4) GESPEICHERTE TEXTE ANWENDEN
       ========================================================== */

    function applyContent(content) {
        if (!content) return;
        Object.keys(content).forEach(function (key) {
            if (key.charAt(0) === "_") return; // __updatedAt usw.
            var value = content[key];
            if (typeof value !== "string") return;
            var node = resolveKey(key);
            if (!node) return; // Element existiert nicht (mehr) – überspringen
            if (directText(node).trim() === value.trim()) return;
            setDirectText(node, value);
        });
    }

    function currentValueOf(key) {
        var node = resolveKey(key);
        if (!node) return null;
        return directText(node).replace(/\s+/g, " ").trim();
    }

    /* ==========================================================
       5) API
       ========================================================== */

    function apiGet(url) {
        return fetch(url, { headers: { "Accept": "application/json" } })
            .then(function (r) { return r.json(); });
    }

    function loadContent(force) {
        return apiGet(ADMIN_CONFIG.api.content).then(function (data) {
            if (!data || !data.ok) throw new Error("Server nicht erreichbar");
            state.lastUpdatedAt = data.updatedAt || null;
            state.remote = {};
            Object.keys(data.content || {}).forEach(function (k) {
                if (k.charAt(0) !== "_") state.remote[k] = data.content[k];
            });
            applyContent(state.remote);
            return data;
        }).catch(function (err) {
            console.warn("[admin] Inhalte konnten nicht geladen werden:", err);
        });
    }

    function saveContent(changes) {
        if (!TOKEN) return Promise.reject(new Error("Nicht eingeloggt"));
        return fetch(ADMIN_CONFIG.api.content, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Admin-Token": TOKEN
            },
            body: JSON.stringify({
                token: TOKEN,
                updates: changes.updates || {},
                deletes: changes.deletes || []
            })
        }).then(function (r) {
            return r.json().then(function (data) {
                if (!r.ok || !data.ok) {
                    var err = new Error(data && data.error ? data.error : "Speichern fehlgeschlagen");
                    err.status = r.status;
                    throw err;
                }
                return data;
            });
        });
    }

    function startPolling() {
        if (!ADMIN_CONFIG.pollInterval || state.pollTimer) return;
        state.pollTimer = setInterval(function () {
            var panelOpen = !!$(".admin-panel");
            if (panelOpen) return; // während des Bearbeitens nicht überschreiben
            if (document.hidden) return;
            loadContent();
        }, ADMIN_CONFIG.pollInterval);
    }

    /* ==========================================================
       6) PASSWORT-FENSTER
       ========================================================== */

    function openPasswordDialog() {
        if ($(".admin-overlay")) return;

        var overlay = el("div", "admin-ui admin-overlay");
        var dialog = el("div", "admin-dialog");
        var heading = el("h2", null, "Admin-Bereich");
        var hint = el("p", null, "Bitte Passwort eingeben, um die Texte zu bearbeiten.");
        var input = el("input", "admin-input");
        input.type = "password";
        input.placeholder = "Passwort";
        input.autocomplete = "current-password";
        var error = el("div", "admin-error");
        var actions = el("div", "admin-actions");
        var cancel = el("button", "admin-btn", "Abbrechen");
        var submit = el("button", "admin-btn primary", "Öffnen");
        actions.appendChild(cancel);
        actions.appendChild(submit);

        dialog.appendChild(heading);
        dialog.appendChild(hint);
        dialog.appendChild(input);
        dialog.appendChild(error);
        dialog.appendChild(actions);
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);

        setTimeout(function () { input.focus(); }, 30);

        function close() { overlay.remove(); }

        function submitPassword() {
            var password = input.value;
            if (!password) { error.textContent = "Bitte Passwort eingeben."; return; }
            submit.disabled = true;
            submit.textContent = "Prüfe…";

            fetch(ADMIN_CONFIG.api.login, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: password })
            }).then(function (r) {
                return r.json().then(function (data) {
                    if (!r.ok || !data.ok) throw new Error(data && data.error ? data.error : "Falsches Passwort");
                    return data;
                });
            }).then(function (data) {
                TOKEN = data.token;
                try { sessionStorage.setItem(ADMIN_CONFIG.tokenKey, TOKEN); } catch (e) {}
                close();
                openPanel();
            }).catch(function (err) {
                error.textContent = err.message || "Login fehlgeschlagen";
                submit.disabled = false;
                submit.textContent = "Öffnen";
                input.select();
            });
        }

        submit.addEventListener("click", submitPassword);
        cancel.addEventListener("click", close);
        input.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); submitPassword(); }
        });
        overlay.addEventListener("mousedown", function (e) {
            if (e.target === overlay) close();
        });
        document.addEventListener("keydown", function escHandler(e) {
            if (e.key === "Escape") {
                close();
                document.removeEventListener("keydown", escHandler);
            }
        });
    }

    /* ==========================================================
       7) BEARBEITUNGS-PANEL
       ========================================================== */

    function openPanel() {
        if ($(".admin-panel")) return;
        document.body.classList.add("admin-mode");
        collectEntries();

        var panel = el("aside", "admin-ui admin-panel");

        /* Kopf */
        var head = el("div", "admin-panel-head");
        var row = el("div", "row");
        var title = el("h2", null, "SHRED. Admin");
        var closeBtn = el("button", "admin-close", "✕");
        closeBtn.type = "button";
        closeBtn.title = "Schließen";
        closeBtn.addEventListener("click", closePanel);
        row.appendChild(title);
        row.appendChild(closeBtn);

        var toolbar = el("div", "admin-toolbar");
        var search = el("input", "admin-input");
        search.type = "search";
        search.placeholder = "Texte durchsuchen…";
        toolbar.appendChild(search);

        var note = el("p", "admin-note", "Einfach lostippen – die Änderung ist sofort auf der Seite sichtbar. Mit „Speichern“ wird sie für alle Besucher online gestellt.");
        head.appendChild(row);
        head.appendChild(toolbar);
        head.appendChild(note);
        panel.appendChild(head);

        /* Liste */
        var list = el("div", "admin-list");
        panel.appendChild(list);

        /* Fuß */
        var status = el("div", "admin-status", "");
        panel.appendChild(status);

        var foot = el("div", "admin-panel-foot");
        var resetAll = el("button", "admin-btn", "Alles zurücksetzen");
        resetAll.type = "button";
        var saveBtn = el("button", "admin-btn primary", "Speichern");
        saveBtn.type = "button";
        var logoutBtn = el("button", "admin-btn", "Logout");
        logoutBtn.type = "button";
        foot.appendChild(resetAll);
        foot.appendChild(saveBtn);
        foot.appendChild(logoutBtn);
        panel.appendChild(foot);

        document.body.appendChild(panel);

        /* Einträge rendern */
        function renderEntries(filter) {
            list.innerHTML = "";
            var q = (filter || "").toLowerCase();
            var shown = 0;

            state.entries.forEach(function (entry) {
                if (q) {
                    var hay = (entry.tag + " " + entry.classes + " " + entry.original + " " + entry.key).toLowerCase();
                    if (hay.indexOf(q) === -1) return;
                }
                shown++;

                var item = el("div", "admin-item");
                var label = el("label");

                var tagSpan = el("span", "tag", entry.tag);
                label.appendChild(tagSpan);
                if (entry.classes) {
                    label.appendChild(document.createTextNode(" "));
                    var clsSpan = el("span", "cls", "." + entry.classes.split(/\s+/).join("."));
                    label.appendChild(clsSpan);
                }
                item.appendChild(label);

                var ta = el("textarea");
                ta.rows = Math.min(6, Math.max(1, Math.ceil(entry.original.length / 42)));
                ta.value = currentValueOf(entry.key) || "";
                ta.setAttribute("data-key", entry.key);
                ta.addEventListener("input", function () {
                    var node = resolveKey(entry.key);
                    if (node) setDirectText(node, ta.value);
                    status.className = "admin-status";
                    status.textContent = "Ungespeicherte Änderungen";
                });
                item.appendChild(ta);

                var footer = el("div", "footer");
                var path = el("span", null, entry.key);
                var reset = el("button", "admin-link", "zurücksetzen");
                reset.type = "button";
                reset.addEventListener("click", function () {
                    ta.value = entry.original;
                    var node = resolveKey(entry.key);
                    if (node) setDirectText(node, entry.original);
                    status.className = "admin-status";
                    status.textContent = "Ungespeicherte Änderungen";
                });
                footer.appendChild(path);
                footer.appendChild(reset);
                item.appendChild(footer);

                list.appendChild(item);
            });

            if (!shown) {
                list.appendChild(el("p", "admin-note", "Keine passenden Textstellen gefunden."));
            }
        }

        renderEntries("");

        search.addEventListener("input", function () { renderEntries(search.value); });

        /* Speichern */
        function collectChanges() {
            var updates = {};
            var deletes = [];
            var textareas = list.querySelectorAll("textarea[data-key]");

            for (var i = 0; i < textareas.length; i++) {
                var ta = textareas[i];
                var key = ta.getAttribute("data-key");
                var value = ta.value.replace(/\s+/g, " ").trim();
                var stored = state.remote[key];

                if (value === "") {
                    if (stored != null) deletes.push(key);
                } else if (value !== stored) {
                    updates[key] = value;
                }
            }
            return { updates: updates, deletes: deletes };
        }

        saveBtn.addEventListener("click", function () {
            if (state.saving) return;
            var changes = collectChanges();
            if (!Object.keys(changes.updates).length && !changes.deletes.length) {
                status.className = "admin-status ok";
                status.textContent = "Alles gespeichert – keine Änderungen.";
                return;
            }

            state.saving = true;
            saveBtn.disabled = true;
            saveBtn.textContent = "Speichere…";

            saveContent(changes).then(function (data) {
                state.remote = {};
                Object.keys(data.content || {}).forEach(function (k) {
                    if (k.charAt(0) !== "_") state.remote[k] = data.content[k];
                });
                state.lastUpdatedAt = data.updatedAt || null;
                status.className = "admin-status ok";
                status.textContent = "Gespeichert ✓  " + new Date().toLocaleTimeString("de-DE");
                toast("Änderungen online gespeichert");
                renderEntries(search.value);
            }).catch(function (err) {
                status.className = "admin-status err";
                status.textContent = err.message || "Speichern fehlgeschlagen";
                if (err.status === 401) {
                    TOKEN = null;
                    try { sessionStorage.removeItem(ADMIN_CONFIG.tokenKey); } catch (e) {}
                    closePanel();
                    openPasswordDialog();
                }
            }).then(function () {
                state.saving = false;
                saveBtn.disabled = false;
                saveBtn.textContent = "Speichern";
            });
        });

        /* Alles zurücksetzen */
        resetAll.addEventListener("click", function () {
            if (!confirm("Alle gespeicherten Änderungen zurücksetzen und die Originaltexte wiederherstellen?")) return;
            var deletes = Object.keys(state.remote);
            if (!deletes.length) { toast("Es gibt keine gespeicherten Änderungen"); return; }

            saveBtn.disabled = true;
            saveContent({ updates: {}, deletes: deletes }).then(function () {
                state.remote = {};
                state.entries.forEach(function (entry) {
                    var node = resolveKey(entry.key);
                    if (node) setDirectText(node, entry.original);
                });
                toast("Alle Texte zurückgesetzt");
                renderEntries(search.value);
                status.className = "admin-status ok";
                status.textContent = "Originaltexte wiederhergestellt.";
            }).catch(function (err) {
                status.className = "admin-status err";
                status.textContent = err.message || "Zurücksetzen fehlgeschlagen";
            }).then(function () {
                saveBtn.disabled = false;
            });
        });

        /* Logout */
        logoutBtn.addEventListener("click", function () {
            fetch(ADMIN_CONFIG.api.logout, {
                method: "POST",
                headers: { "X-Admin-Token": TOKEN || "" }
            }).catch(function () {}).then(function () {
                TOKEN = null;
                try { sessionStorage.removeItem(ADMIN_CONFIG.tokenKey); } catch (e) {}
                closePanel();
                toast("Abgemeldet");
            });
        });

        /* Inline-Bearbeitung: Klick auf ein markiertes Element springt
           zum passenden Feld im Panel */
        document.body.addEventListener("click", adminInlineClick);
    }

    function adminInlineClick(e) {
        if (!$(".admin-panel")) return;
        var target = e.target.closest("[data-editable='1']");
        if (!target) return;
        // Links im Admin-Modus nicht öffnen
        if (e.target.closest("a")) e.preventDefault();
        var key = pathKey(target);
        var ta = document.querySelector('.admin-panel textarea[data-key="' + key + '"]');
        if (ta) {
            ta.focus();
            ta.select();
            ta.scrollIntoView({ block: "center", behavior: "smooth" });
        }
    }

    function closePanel() {
        var panel = $(".admin-panel");
        if (panel) panel.remove();
        document.body.classList.remove("admin-mode");
        document.body.removeEventListener("click", adminInlineClick);
    }

    /* ==========================================================
       8) ADMIN-BUTTON
       ========================================================== */

    function isOpen() {
        return !!$(".admin-panel") || !!$(".admin-overlay");
    }

    function closeEverything() {
        var overlay = $(".admin-overlay");
        if (overlay) overlay.remove();
        closePanel();
    }

    function onAdminButtonClick(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }

        // Button erneut gedrückt → das schließen, was gerade offen ist
        if (isOpen()) {
            closeEverything();
            return;
        }

        // Schon eingeloggt? Dann direkt ins Panel, sonst Passwort abfragen
        if (!TOKEN) {
            openPasswordDialog();
            return;
        }

        fetch(ADMIN_CONFIG.api.session, {
            headers: { "X-Admin-Token": TOKEN, "Accept": "application/json" }
        }).then(function (r) { return r.json(); }).then(function (data) {
            if (data && data.ok) {
                openPanel();
            } else {
                TOKEN = null;
                try { sessionStorage.removeItem(ADMIN_CONFIG.tokenKey); } catch (e2) {}
                openPasswordDialog();
            }
        }).catch(function () {
            // Server nicht erreichbar
            TOKEN = null;
            openPasswordDialog();
        });
    }

    function wireAdminButton() {
        var button = document.getElementById("adminpanel");
        if (!button) return;

        button.setAttribute("data-no-edit", "");
        button.type = "button";
        button.title = "Admin-Bereich";
        button.style.cursor = "pointer";
        button.addEventListener("click", onAdminButtonClick);
    }

    /* ==========================================================
       9) START
       ========================================================== */

    function init() {
        wireAdminButton();

        // Originaltexte merken (für „zurücksetzen“)
        collectEntries();

        // Gespeicherte Texte laden und anwenden
        loadContent().then(function () {
            startPolling();
        });

        // Beim Zurückkehren auf den Tab aktualisieren
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden && !isOpen()) loadContent();
        });

        // Tastenkürzel: Strg/Cmd + Shift + A öffnet/schließt den Admin-Bereich
        document.addEventListener("keydown", function (e) {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "A" || e.key === "a")) {
                e.preventDefault();
                onAdminButtonClick();
            }
            if (e.key === "Escape") closeEverything();
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
